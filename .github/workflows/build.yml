name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # WinUI 3 packaging tasks live in Visual Studio, not in the .NET SDK, so the
      # build has to run on MSBuild.exe from VS. The runner has the full Windows
      # workload, which means the local makepri shim is not needed either.
      - name: Locate Visual Studio MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
                                 -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild.exe not found' }
          "MSBUILD=$($msbuild.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $msbuild -version | Select-Object -First 1

      - name: Drop local build shim
        shell: pwsh
        run: Remove-Item src/TBox.WinUI/Directory.Build.targets -Force

      - name: Restore
        shell: pwsh
        run: |
          & $env:MSBUILD src/TBox.WinUI/TBox.WinUI.csproj -t:Restore `
              -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -v:m

      - name: Publish (self-contained)
        shell: pwsh
        run: |
          & $env:MSBUILD src/TBox.WinUI/TBox.WinUI.csproj -t:Publish `
              -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 `
              -p:SelfContained=true -p:WindowsAppSDKSelfContained=true `
              -p:PublishDir="$PWD\dist\\" -v:m
          if ($LASTEXITCODE -ne 0) { throw "publish failed: $LASTEXITCODE" }

      - name: Verify payload
        shell: pwsh
        run: |
          $required = 'TBox.exe','resources.pri','MainWindow.xbf','Microsoft.ui.xaml.dll','Microsoft.WindowsAppRuntime.dll'
          foreach ($f in $required) {
            if (-not (Test-Path "dist/$f")) { throw "missing $f" }
          }
          "size: {0:N0} MB" -f ((Get-ChildItem dist -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Smoke test (must reach Activated)
        shell: pwsh
        run: |
          $env:TBOX_DATA = Join-Path $env:RUNNER_TEMP 'tboxdata'
          $log = Join-Path $env:LOCALAPPDATA 'TBox\app.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath (Resolve-Path 'dist\TBox.exe') -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          $activated = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Activated' -Quiet)) { $activated = $true; break }
            if ($p.HasExited) { break }
          }

          if (Test-Path $log) { Get-Content $log -Tail 15 }
          if ($activated -ne $true) { throw 'app never reached Activated (WinUI runtime init failed)' }
          if ($p.HasExited) { throw "app exited early: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          'smoke test passed'

      - name: Package
        shell: pwsh
        run: |
          $zip = "TBox-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force
          "{0:N1} MB" -f ((Get-Item $zip).Length / 1MB)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TBox-win-x64
          path: TBox-*-win-x64.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TBox-*-win-x64.zip
          generate_release_notes: true
