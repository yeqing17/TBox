name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Same build path as a developer machine: the repository shim replaces the
      # Visual Studio-only MSIX tasks and generates resources.pri with makepri.
      - name: Publish (self-contained)
        run: >
          dotnet publish src/TBox.WinUI/TBox.WinUI.csproj
          -c Release -r win-x64 --self-contained true
          -p:Platform=x64 -p:WindowsAppSDKSelfContained=true
          -o dist

      - name: Verify payload
        shell: pwsh
        run: |
          $required = 'TBox.exe','resources.pri','MainWindow.xbf','Microsoft.ui.xaml.dll','Microsoft.WindowsAppRuntime.dll'
          foreach ($f in $required) {
            if (-not (Test-Path "dist/$f")) { throw "missing $f" }
          }
          "size: {0:N0} MB / {1} files" -f `
            ((Get-ChildItem dist -Recurse | Measure-Object Length -Sum).Sum / 1MB), `
            (Get-ChildItem dist -Recurse -File | Measure-Object).Count

      - name: Smoke test (must reach Activated)
        shell: pwsh
        run: |
          $env:TBOX_DATA = Join-Path $env:RUNNER_TEMP 'tboxdata'
          $log = Join-Path $env:LOCALAPPDATA 'TBox\app.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath (Resolve-Path 'dist\TBox.exe') -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          $activated = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Activated' -Quiet)) { $activated = $true; break }
            if ($p.HasExited) { break }
          }

          if (Test-Path $log) { Get-Content $log -Tail 15 }
          if ($activated -ne $true) { throw 'app never reached Activated (WinUI runtime init failed)' }
          if ($p.HasExited) { throw "app exited early: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          'smoke test passed'

      - name: Package
        shell: pwsh
        run: |
          $zip = "TBox-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force
          "{0:N1} MB" -f ((Get-Item $zip).Length / 1MB)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TBox-win-x64
          path: TBox-*-win-x64.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TBox-*-win-x64.zip
          generate_release_notes: true
