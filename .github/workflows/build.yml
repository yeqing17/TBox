name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Publish
        run: >
          dotnet publish src/TBox.WinUI/TBox.WinUI.csproj
          -c Release -r win-x64 --self-contained false -p:Platform=x64
          -o dist

      - name: Sanity check output
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/TBox.exe')) { throw 'TBox.exe missing' }
          if (-not (Test-Path 'dist/resources.pri')) { throw 'resources.pri missing' }
          if (-not (Test-Path 'dist/MainWindow.xbf')) { throw 'MainWindow.xbf missing' }
          Get-ChildItem dist | Measure-Object | ForEach-Object { "dist files: $($_.Count)" }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath TBox-v${{ github.run_number }}-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TBox-win-x64
          path: TBox-*-win-x64.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TBox-*-win-x64.zip
          generate_release_notes: true
