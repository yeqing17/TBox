name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RUNTIME_INSTALLER_URL: https://aka.ms/windowsappsdk/1.7/latest/windowsappruntimeinstall-x64.exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Lite: framework-dependent .NET. Small download; the target needs the .NET 8
      # Desktop Runtime and Windows App Runtime 1.7.
      - name: Publish lite (framework-dependent .NET)
        run: >
          dotnet publish src/TBox.WinUI/TBox.WinUI.csproj
          -c Release -r win-x64 --self-contained false
          -p:Platform=x64 -p:WindowsAppSDKSelfContained=false
          -o dist-lite

      # Full: self-contained .NET (no .NET install needed on the target). The Windows
      # App SDK stays a framework dependency because WinAppSDK self-contained crashes at
      # startup for this app, so the runtime installer ships alongside instead.
      - name: Publish full (.NET self-contained)
        run: >
          dotnet publish src/TBox.WinUI/TBox.WinUI.csproj
          -c Release -r win-x64 --self-contained true
          -p:Platform=x64 -p:WindowsAppSDKSelfContained=false
          -o dist-full

      - name: Bundle runtime installer and setup script (full only)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:RUNTIME_INSTALLER_URL -OutFile 'dist-full/WindowsAppRuntimeInstall-x64.exe'
          Copy-Item scripts/install-and-run.cmd dist-full/ -Force
          "installer: {0:N0} MB" -f ((Get-Item 'dist-full/WindowsAppRuntimeInstall-x64.exe').Length / 1MB)

      - name: Verify payloads
        shell: pwsh
        run: |
          $common = 'TBox.exe','resources.pri','MainWindow.xbf','Assets/tbox.ico','Assets/tbox-512.png'
          $full = $common + 'WindowsAppRuntimeInstall-x64.exe','install-and-run.cmd'
          foreach ($f in $common) {
            if (-not (Test-Path "dist-lite/$f")) { throw "lite: missing $f" }
            if (-not (Test-Path "dist-full/$f")) { throw "full: missing $f" }
          }
          foreach ($f in $full) {
            if (-not (Test-Path "dist-full/$f")) { throw "full: missing $f" }
          }
          if (Test-Path 'dist-lite/WindowsAppRuntimeInstall-x64.exe') {
            throw 'lite package must not bundle the Windows App Runtime installer'
          }

          function Measure-Package([string]$dir) {
            [pscustomobject]@{
              MB = [math]::Round((Get-ChildItem $dir -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)
              Files = (Get-ChildItem $dir -Recurse -File | Measure-Object).Count
            }
          }
          $lite = Measure-Package 'dist-lite'
          $fullSize = Measure-Package 'dist-full'
          "lite: {0} MB / {1} files" -f $lite.MB, $lite.Files
          "full: {0} MB / {1} files" -f $fullSize.MB, $fullSize.Files

      - name: Install Windows App Runtime (as an end user would)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path 'dist-full/WindowsAppRuntimeInstall-x64.exe') -ArgumentList '--quiet' -Wait -PassThru
          "runtime installer exit: $($p.ExitCode)"

      - name: Smoke test lite and full (must reach Activated)
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'TBox\app.log'

          function Test-TBox([string]$exe, [string]$dataDir) {
            Remove-Item $log -Force -ErrorAction SilentlyContinue
            $env:TBOX_DATA = $dataDir
            $p = Start-Process -FilePath (Resolve-Path $exe) -PassThru
            $deadline = (Get-Date).AddSeconds(30)
            $activated = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Activated' -Quiet)) { $activated = $true; break }
              if ($p.HasExited) { break }
            }

            if (Test-Path $log) { Get-Content $log -Tail 15 }
            if ($activated -ne $true) { throw "$exe never reached Activated (WinUI runtime init failed)" }
            if ($p.HasExited) { throw "$exe exited early: $($p.ExitCode)" }
            Stop-Process -Id $p.Id -Force
            Wait-Process -Id $p.Id -ErrorAction SilentlyContinue
            "smoke test passed: $exe"
          }

          Test-TBox 'dist-lite\TBox.exe' (Join-Path $env:RUNNER_TEMP 'tboxdata-lite')
          Test-TBox 'dist-full\TBox.exe' (Join-Path $env:RUNNER_TEMP 'tboxdata-full')

      - name: Package lite and full
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          $zips = @(
            @{ Path = "TBox-$ref-lite-win-x64.zip"; Dir = 'dist-lite' },
            @{ Path = "TBox-$ref-full-win-x64.zip"; Dir = 'dist-full' }
          )
          foreach ($zip in $zips) {
            Compress-Archive -Path "$($zip.Dir)/*" -DestinationPath $zip.Path -Force
            "{0}: {1:N1} MB" -f (Split-Path $zip.Path -Leaf), ((Get-Item $zip.Path).Length / 1MB)
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TBox-win-x64-packages
          path: TBox-*-win-x64.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TBox-*-win-x64.zip
          generate_release_notes: true
